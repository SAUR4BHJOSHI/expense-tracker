
name: expense-tracker

services:

  et-kong:
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - et-expense-tracker-network

  et-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: et_admin
      POSTGRES_PASSWORD: et_admin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - et-expense-tracker-network

  et-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - et-expense-tracker-network

  et-kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://et-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@et-kafka:9093
      # Single-broker development settings; production needs replication.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    networks:
      - et-expense-tracker-network

  et-kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: expense-tracker-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: et-kafka:29092
    ports:
      # No UI authentication: expose only on this machine for local development.
      - "127.0.0.1:8085:8080"
    depends_on:
      - et-kafka
    networks:
      - et-expense-tracker-network

  et-auth-service:
    container_name: et-auth-service
    image: et-auth-service:latest
    environment:
      - AUTH_DB_URL=jdbc:postgresql://et-database:5432/auth_db
      - AUTH_DB_USERNAME=et_admin
      - AUTH_DB_PASSWORD=et_admin_password
      - REDIS_HOST=et-redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=et-kafka:29092
    expose:
        - "8081"
    ports:
      - "8081:8081"
    depends_on:
      - et-database
      - et-redis
      - et-kafka
    networks:
      - et-expense-tracker-network

  et-user-service:
    container_name: et-user-service
    image: et-user-service:latest
    environment:
      - USER_DB_URL=jdbc:postgresql://et-database:5432/user_db
      - USER_DB_USERNAME=et_admin
      - USER_DB_PASSWORD=et_admin_password
      - KAFKA_BOOTSTRAP_SERVERS=et-kafka:29092
    expose:
      - "8082"
    ports:
      - "8082:8082"
    depends_on:
      - et-database
      - et-kafka
    networks:
      - et-expense-tracker-network


volumes:
  postgres_data:
  redis_data:

networks:
    et-expense-tracker-network:
      driver: bridge
