spring:
  application:
    name: auth-service

  datasource:
    url: ${auth.db.url}
    username: ${auth.db.username}
    password: ${auth.db.password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}

  kafka:
    topic: et-user-registration
    bootstrap-servers: ${kafka.bootstrap.servers}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024}
  access-token-expiry: 900000        # 15 minutes
  refresh-token-expiry: 604800000    # 7 days
  issuer: expense-tracker-auth

services:
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

